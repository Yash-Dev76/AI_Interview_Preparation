{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h3 class="fw-bold text-primary mb-3">📄 Resume Analyzer</h3>
                <p class="text-muted">Upload your resume in PDF format to analyze skill coverage and structural completeness.</p>
                
                <form method="POST" action="{{ url_for('resume') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Select PDF File</label>
                        <input type="file" name="resume_file" class="form-control" accept=".pdf" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analyze Resume</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
