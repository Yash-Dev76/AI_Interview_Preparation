{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <h3 class="fw-bold mb-4">Manage Aptitude Questions</h3>

    <div class="card p-4 mb-4">
        <h5>Add Aptitude Question</h5>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Question</label>
                <input type="text" name="question" class="form-control" required>
            </div>
            <div class="row">
                <div class="col-md-3 mb-2"><input type="text" name="option_a" class="form-control" placeholder="Option A" required></div>
                <div class="col-md-3 mb-2"><input type="text" name="option_b" class="form-control" placeholder="Option B" required></div>
                <div class="col-md-3 mb-2"><input type="text" name="option_c" class="form-control" placeholder="Option C" required></div>
                <div class="col-md-3 mb-2"><input type="text" name="option_d" class="form-control" placeholder="Option D" required></div>
            </div>
            <div class="row mt-2">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Correct Option (A, B, C, or D)</label>
                    <input type="text" name="correct_answer" class="form-control" maxlength="1" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" class="form-control" placeholder="e.g. Quantitative Aptitude" required>
                </div>
            </div>
            <button type="submit" class="btn btn-warning text-white">Add Question</button>
        </form>
    </div>

    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Question</th>
                <th>Correct</th>
                <th>Category</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for q in questions %}
                <tr>
                    <td>{{ q.id }}</td>
                    <td>{{ q.question }}</td>
                    <td>{{ q.correct_answer }}</td>
                    <td>{{ q.category }}</td>
                    <td><a href="{{ url_for('delete_aptitude_question', qid=q.id) }}" class="btn btn-danger btn-sm">Delete</a></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
