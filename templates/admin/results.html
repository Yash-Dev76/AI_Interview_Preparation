{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <h3 class="fw-bold mb-4">Student Scores & Performance</h3>
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>Student</th>
                <th>Email</th>
                <th>Resume</th>
                <th>Interview</th>
                <th>Aptitude</th>
                <th>Overall</th>
            </tr>
        </thead>
        <tbody>
            {% for r in results %}
                <tr>
                    <td>{{ r.name }}</td>
                    <td>{{ r.email }}</td>
                    <td>{{ r.resume_score }}%</td>
                    <td>{{ r.interview_score }}%</td>
                    <td>{{ r.aptitude_score }}%</td>
                    <td><span class="badge bg-primary fs-6">{{ r.overall_score }}%</span></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
