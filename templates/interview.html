{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h3 class="fw-bold text-success mb-3">💬 AI Mock Interview</h3>
                
                {% if question %}
                    <div class="alert alert-secondary fs-5 fw-bold mb-4">
                        Question: {{ question.question }}
                    </div>

                    <form method="POST" action="{{ url_for('interview') }}">
                        <input type="hidden" name="question_id" value="{{ question.id }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Type Your Response:</label>
                            <textarea name="answer" rows="6" class="form-control" placeholder="Type your answer clearly..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Submit Response</button>
                    </form>
                {% else %}
                    <p>No interview questions available right now.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
