{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <h3 class="fw-bold text-warning mb-4">📝 Placement Aptitude Test</h3>
    <form method="POST" action="{{ url_for('aptitude') }}">
        {% for q in questions %}
            <div class="card p-3 mb-3">
                <h5>Q{{ loop.index }}. {{ q.question }} <span class="badge bg-secondary float-end fs-6">{{ q.category }}</span></h5>
                <div class="mt-3">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="A" id="q_{{ q.id }}_a" required>
                        <label class="form-check-label" for="q_{{ q.id }}_a">A) {{ q.option_a }}</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="B" id="q_{{ q.id }}_b">
                        <label class="form-check-label" for="q_{{ q.id }}_b">B) {{ q.option_b }}</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="C" id="q_{{ q.id }}_c">
                        <label class="form-check-label" for="q_{{ q.id }}_c">C) {{ q.option_c }}</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="D" id="q_{{ q.id }}_d">
                        <label class="form-check-label" for="q_{{ q.id }}_d">D) {{ q.option_d }}</label>
                    </div>
                </div>
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-warning text-white btn-lg w-100">Submit Test</button>
    </form>
</div>
{% endblock %}
